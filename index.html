<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e4fa8">
<title>在席チームメダル</title>
<style>
  :root {
    --primary: #1e4fa8;
    --primary-dark: #173f88;
    --text: #222;
    --muted: #555;
    --line: #8a8a8a;
    --bg: #f5f5f5;
    --footer: #ebebeb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ヘッダー */
  header {
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    padding: 8px 12px;
    padding-top: calc(8px + env(safe-area-inset-top));
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .icon-btn { background: none; border: 0; color: inherit; padding: 4px; cursor: pointer; display: flex; }
  .brand { font-size: 24px; letter-spacing: .5px; flex: 1; }
  .user-box { text-align: right; font-size: 14px; line-height: 1.4; min-width: 0; }
  .user-box .email { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .status { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .status .dot { width: 12px; height: 12px; border-radius: 50%; background: #6cc24a; border: 1px solid #fff; }

  /* 本体 */
  main { flex: 1; width: 100%; max-width: 480px; margin: 0 auto; padding: 32px 24px 40px; }
  .screen { display: none; }
  .screen.active { display: block; }
  h1 { font-size: 17px; font-weight: 500; text-align: center; margin: 24px 0 20px; }

  .field { display: grid; grid-template-columns: 84px 1fr; align-items: end; gap: 12px; margin-bottom: 18px; }
  .field label { text-align: right; font-size: 15px; padding-bottom: 6px; }
  .field input, .field .value {
    font: inherit; font-size: 15px; color: var(--text);
    border: 0; border-bottom: 1px solid var(--line);
    background: transparent; padding: 6px 0; width: 100%; min-width: 0;
    border-radius: 0; outline: none;
  }
  .field input:focus { border-bottom: 2px solid var(--primary); padding-bottom: 5px; }
  .field .value { word-break: break-all; }

  .actions { margin-top: 40px; display: grid; gap: 14px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font: inherit; font-size: 18px; height: 56px; border-radius: 4px; cursor: pointer;
    border: 2px solid var(--primary); transition: background .15s, transform .05s;
  }
  .btn:active { transform: scale(.99); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-outline { background: #fff; color: var(--primary); }
  .btn-outline:hover { background: #eef3fc; }

  /* 入力画面のミニステータス */
  .mini-status { width: 100%; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #fff; border: 1px solid #dde3ee; border-radius: 10px; padding: 10px 14px; margin-bottom: 24px; font: inherit; font-size: 14px; color: var(--text); cursor: pointer; text-align: left; }
  .mini-status b { font-size: 20px; color: var(--primary); margin-left: 2px; }
  .mini-medals { display: flex; gap: 2px; }
  .mini-medals img { width: 20px; }
  .mini-next { margin-left: auto; color: var(--muted); font-size: 12px; }

  /* 完了画面 */
  .done { text-align: center; padding-top: 8px; }
  .done h2 { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
  .summary { background: #fff; border-radius: 6px; padding: 16px 20px; text-align: left; font-size: 14px; margin: 20px 0 24px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .summary dl { display: grid; grid-template-columns: 84px 1fr; gap: 10px 12px; margin: 0; }
  .summary dt { color: var(--muted); }
  .summary dd { margin: 0; word-break: break-all; }
  .stack { display: grid; gap: 12px; }

  /* タッチ数カード */
  .touch-card { position: relative; background: linear-gradient(135deg, #1e4fa8, #3b6fd1); color: #fff; border-radius: 14px; padding: 18px 18px 22px; box-shadow: 0 6px 16px rgba(30,79,168,.3); }
  .touch-card .label { font-size: 14px; opacity: .9; }
  .touch-card .month { font-size: 12px; opacity: .75; }
  .counter { position: relative; display: inline-block; font-size: 64px; font-weight: 900; line-height: 1.1; margin: 4px 0 2px; }
  .counter small { font-size: 18px; font-weight: 700; margin-left: 4px; }
  .plus { position: absolute; right: -40px; top: 6px; font-size: 22px; font-weight: 900; color: #ffd76a; opacity: 0; }
  .plus.go { animation: plus 1.2s ease-out; }
  @keyframes plus { 0% { opacity: 0; transform: translateY(14px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-22px); } }
  .counter.bump { animation: bump .4s cubic-bezier(.2,2,.4,1); }
  @keyframes bump { 50% { transform: scale(1.18); } }

  .track { position: relative; height: 12px; background: rgba(255,255,255,.25); border-radius: 6px; margin: 30px 16px 34px; }
  .track .fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #ffd76a, #fff3b0); width: 0; transition: width 1s cubic-bezier(.3,1,.4,1); }
  .track .mark { position: absolute; top: 50%; transform: translate(-50%, -62%); text-align: center; }
  .track .mark img { width: 34px; display: block; filter: grayscale(1) brightness(1.3); opacity: .55; transition: all .4s; }
  .track .mark.got img { filter: none; opacity: 1; }
  .track .mark span { display: block; font-size: 11px; font-weight: 700; margin-top: -2px; }
  .next { font-size: 14px; font-weight: 700; color: #ffd76a; min-height: 20px; }

  /* メダル獲得演出 */
  .award { position: fixed; inset: 0; background: rgba(10,15,40,.82); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 40; padding: 24px; text-align: center; color: #fff; }
  .award.open { display: flex; }
  .award .glow { position: relative; width: 220px; height: 260px; display: flex; align-items: center; justify-content: center; }
  .award .glow::before { content: ""; position: absolute; left: 50%; top: 55%; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%;
    background: repeating-conic-gradient(rgba(255,215,106,.35) 0 10deg, transparent 10deg 20deg);
    -webkit-mask: radial-gradient(circle, #000 15%, transparent 65%); mask: radial-gradient(circle, #000 15%, transparent 65%); animation: rot 10s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .award img { position: relative; width: 180px; animation: medalIn 1.1s cubic-bezier(.2,1.3,.4,1); }
  @keyframes medalIn { 0% { transform: translateY(-260px) rotateY(0) scale(.4); opacity: 0; } 60% { transform: translateY(0) rotateY(720deg) scale(1.1); opacity: 1; } 100% { transform: rotateY(720deg) scale(1); } }
  .award h3 { font-size: 26px; margin: 12px 0 4px; color: #ffd76a; }
  .award p { margin: 0 0 22px; font-size: 15px; }
  .award .btn { min-width: 200px; background: #ffd76a; color: #4a3500; border-color: #ffd76a; font-weight: 800; }

  /* コレクション */
  .col-head h2 { font-size: 20px; margin: 8px 0 12px; }
  .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .totals div { background: #fff; border-radius: 10px; padding: 10px 6px 8px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .totals img { width: 40px; }
  .totals b { display: block; font-size: 20px; }
  .totals span { font-size: 12px; color: var(--muted); }
  .months { display: grid; gap: 12px; margin-bottom: 24px; }
  .month-row { background: #fff; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .month-row.current { outline: 2px solid var(--primary); }
  .month-row .info { flex: 1; min-width: 0; }
  .month-row .ym { font-weight: 700; font-size: 15px; }
  .month-row .ym em { font-style: normal; font-size: 11px; color: #fff; background: var(--primary); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
  .month-row .cnt { font-size: 13px; color: var(--muted); }
  .month-row .medals { display: flex; gap: 4px; }
  .month-row .medals img { width: 44px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; margin: -10px 0 18px; }
  .demo { display: flex; justify-content: center; gap: 16px; }
  .demo button { background: none; border: 0; color: #999; font-size: 12px; text-decoration: underline; cursor: pointer; }

  /* チーム */
  .team-name { font-size: 12px; opacity: .8; margin-top: 2px; }
  .members { background: #fff; border-radius: 12px; padding: 14px 16px 6px; margin-top: 16px; text-align: left; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .members h3 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .member { display: grid; grid-template-columns: 22px 92px 1fr 34px; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
  .member .rank { font-weight: 800; color: var(--muted); text-align: center; }
  .member .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .member .bar { height: 10px; background: #e8edf5; border-radius: 5px; overflow: hidden; }
  .member .bar div { height: 100%; background: #9fb4dc; border-radius: 5px; transition: width .8s cubic-bezier(.3,1,.4,1); }
  .member .num { text-align: right; font-weight: 700; }
  .member.me { background: #fff8e1; margin: 0 -8px; padding: 6px 8px; border-radius: 8px; }
  .member.me .name { font-weight: 800; color: var(--primary); }
  .member.me .bar div { background: linear-gradient(90deg, #f39c12, #ffd76a); }
  .month-row .cnt b { color: var(--text); }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

  /* フッター */
  footer { background: var(--footer); padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); font-size: 14px; }
  footer nav { display: flex; flex-wrap: wrap; gap: 8px 0; }
  footer nav a { color: var(--primary); text-decoration: none; padding: 0 12px; border-left: 1px solid #999; }
  footer nav a:first-child { border-left: 0; padding-left: 0; }
  footer .copy { color: #888; text-align: center; margin-top: 16px; font-size: 12px; }
</style>
</head>
<body>
  <header>
    <button class="icon-btn" aria-label="メニュー">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <div class="brand">SEATouch</div>
    <div class="user-box">
      <div class="email" id="headerUser"></div>
      <div class="status">
        <span class="dot"></span>テレワーク
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>
      </div>
    </div>
  </header>

  <canvas id="confetti"></canvas>

  <main>
    <!-- 入力画面 -->
    <section class="screen active" id="screen-form">
      <h1>在席退席登録</h1>
      <button class="mini-status" data-go="collection">
        <span>チームの今月 <b id="miniCount">0</b></span>
        <span class="mini-medals" id="miniMedals"></span>
        <span class="mini-next" id="miniNext"></span>
      </button>
      <div class="field">
        <label for="card">カード番号</label>
        <input id="card" type="text" inputmode="numeric" autocomplete="off">
      </div>
      <div class="field">
        <label>ユーザーID</label>
        <div class="value" id="userId"></div>
      </div>
      <div class="field">
        <label for="comment">コメント</label>
        <input id="comment" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="datetime">日時</label>
        <input id="datetime" type="datetime-local">
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="btnIn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M11 7 9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-8v2h8v14z"/></svg>
          在席登録
        </button>
        <button class="btn btn-outline" id="btnOut">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="m17 7-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8v-2H4V5z"/></svg>
          退席登録
        </button>
      </div>
    </section>

    <!-- 完了画面 -->
    <section class="screen" id="screen-done">
      <div class="done">
        <h2 id="doneTitle">在席登録が完了しました</h2>
        <div class="touch-card" id="touchCard">
          <div class="label">チームの今月のタッチ数</div>
          <div class="month" id="touchMonth"></div>
          <div class="team-name" id="teamName"></div>
          <div class="counter" id="counter"><span id="countNum">0</span><small>タッチ</small><span class="plus" id="plus">+1</span></div>
          <div class="track" id="track"><div class="fill" id="trackFill"></div></div>
          <div class="next" id="nextText"></div>
        </div>
        <div class="members">
          <h3 id="membersTitle">メンバー別のタッチ数</h3>
          <div id="memberList"></div>
        </div>
        <div class="summary">
          <dl>
            <dt>ユーザーID</dt><dd id="sumUser"></dd>
            <dt>日時</dt><dd id="sumTime"></dd>
            <dt>コメント</dt><dd id="sumComment"></dd>
          </dl>
        </div>
        <div class="stack">
          <button class="btn btn-primary" data-go="collection">チームメダルコレクションを見る</button>
          <button class="btn btn-outline" data-go="form">戻る</button>
        </div>
      </div>
    </section>

    <!-- メダルコレクション -->
    <section class="screen" id="screen-collection">
      <div class="col-head"><h2>チームメダルコレクション</h2></div>
      <div class="totals" id="totals"></div>
      <div class="months" id="months"></div>
      <p class="note">※チームの他メンバーと過去の月はデモ用のサンプルデータです</p>
      <div class="stack">
        <button class="btn btn-outline" data-go="form">戻る</button>
        <div class="demo">
          <button id="btnDemoAdd">自分の今月を+4タッチ（デモ用）</button>
          <button id="btnReset">リセット（デモ用）</button>
        </div>
      </div>
    </section>
  </main>

  <div class="award" id="award">
    <div class="glow"><img id="awardImg" src="" alt=""></div>
    <h3 id="awardTitle"></h3>
    <p id="awardText"></p>
    <button class="btn" id="btnAwardClose">やったね！</button>
  </div>

  <footer>
    <nav>
      <a href="#">利用規約</a>
      <a href="#">プライバシーポリシー</a>
      <a href="#">ウェブアクセシビリティ</a>
    </nav>
    <div class="copy">Prototype — 実際の登録は行われません</div>
  </footer>

<script>
  const USER_ID = 'taro.yamada@example.com';
  const STORE_KEY = 'team-touch-medal-v1';
  const TEAM_NAME = '企画開発チーム';
  // 自分以外のメンバー（デモ用）。cur = 今月、past = 1〜5か月前のタッチ数
  const OTHERS = [
    { name: '佐藤 花子',   cur: 13, past: [25, 12, 7, 19, 5] },
    { name: '鈴木 一郎',   cur: 11, past: [23, 13, 6, 18, 4] },
    { name: '高橋 美咲',   cur: 10, past: [22, 11, 6, 17, 5] },
    { name: '田中 健太',   cur: 9,  past: [20, 10, 6, 16, 4] },
    { name: '伊藤 さくら', cur: 7,  past: [18, 9, 5, 14, 3] },
  ];
  const TEAM_SIZE = OTHERS.length + 1;
  // チームメダル：1人あたり 5 / 10 / 20 タッチ × メンバー数
  const MEDALS = [
    { id: 'bronze', name: 'ブロンズ', goal: 5 * TEAM_SIZE },
    { id: 'silver', name: 'シルバー', goal: 10 * TEAM_SIZE },
    { id: 'gold',   name: 'ゴールド', goal: 20 * TEAM_SIZE },
  ];
  const MAX_GOAL = MEDALS[MEDALS.length - 1].goal;
  const $ = (id) => document.getElementById(id);
  const medalSrc = (id) => `assets/medal-${id}.svg`;

  $('headerUser').textContent = USER_ID;
  $('userId').textContent = USER_ID;

  function nowLocal() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  }
  $('datetime').value = nowLocal();
  const thisMonth = () => nowLocal().slice(0, 7);
  const monthLabel = (ym) => `${ym.slice(0, 4)}年${Number(ym.slice(5, 7))}月`;
  function addMonths(ym, n) {
    const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)) - 1 + n, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  function monthsAgo(ym) {
    const cur = thisMonth();
    return (Number(cur.slice(0, 4)) - Number(ym.slice(0, 4))) * 12 + Number(cur.slice(5, 7)) - Number(ym.slice(5, 7));
  }
  function otherCount(member, ym) {
    const n = monthsAgo(ym);
    return n === 0 ? member.cur : (member.past[n - 1] || 0);
  }

  // 自分の月ごとのタッチ数（{ 'YYYY-MM': 回数 }）。このブラウザ内にだけ保存
  function sampleHistory() {
    const cur = thisMonth();
    return { [addMonths(cur, -1)]: 22, [addMonths(cur, -2)]: 13, [addMonths(cur, -3)]: 7, [addMonths(cur, -4)]: 18, [addMonths(cur, -5)]: 3 };
  }
  function load() {
    try { const v = JSON.parse(localStorage.getItem(STORE_KEY)); if (v) return v; } catch {}
    return sampleHistory();
  }
  let touches = load();
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(touches)); } catch {} }

  const myCount = (ym) => touches[ym] || 0;
  const teamCount = (ym) => myCount(ym) + OTHERS.reduce((a, m) => a + otherCount(m, ym), 0);

  const earned = (count) => MEDALS.filter(m => count >= m.goal);
  const nextMedal = (count) => MEDALS.find(m => count < m.goal);

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    window.scrollTo(0, 0);
  }
  function go(name) {
    if (name === 'collection') renderCollection();
    if (name === 'form') { $('datetime').value = nowLocal(); renderMini(); }
    show(`screen-${name}`);
  }
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));

  function renderMini() {
    const c = teamCount(thisMonth());
    $('miniCount').textContent = c;
    $('miniMedals').innerHTML = earned(c).map(m => `<img src="${medalSrc(m.id)}" alt="${m.name}">`).join('');
    const n = nextMedal(c);
    $('miniNext').textContent = n ? `${n.name}まであと${n.goal - c}` : '今月コンプリート！';
  }
  renderMini();

  function fillSummary(kind) {
    const dt = $('datetime').value || nowLocal();
    $('doneTitle').textContent = `${kind}登録が完了しました`;
    $('sumUser').textContent = USER_ID;
    $('sumTime').textContent = dt.replace('T', ' ').replace(/-/g, '/');
    $('sumComment').textContent = $('comment').value || '—';
  }

  function buildTrack(count) {
    $('track').querySelectorAll('.mark').forEach(e => e.remove());
    MEDALS.forEach(m => {
      const el = document.createElement('div');
      el.className = 'mark' + (count >= m.goal ? ' got' : '');
      el.dataset.goal = m.goal;
      el.style.left = `${m.goal / MAX_GOAL * 100}%`;
      el.innerHTML = `<img src="${medalSrc(m.id)}" alt="${m.name}"><span>${m.goal}</span>`;
      $('track').appendChild(el);
    });
  }
  function setProgress(count) {
    $('trackFill').style.width = `${Math.min(count, MAX_GOAL) / MAX_GOAL * 100}%`;
    $('track').querySelectorAll('.mark').forEach(e => e.classList.toggle('got', count >= Number(e.dataset.goal)));
    const n = nextMedal(count);
    $('nextText').textContent = n ? `チームで${n.name}メダルまで あと${n.goal - count}タッチ！` : '今月のチームメダルをすべて獲得しました！';
  }

  function renderMembers(ym, mine) {
    const list = [{ name: 'あなた', count: mine, me: true }, ...OTHERS.map(m => ({ name: m.name, count: otherCount(m, ym) }))]
      .sort((a, b) => b.count - a.count || (a.me ? -1 : 1));
    const max = Math.max(1, ...list.map(m => m.count));
    $('membersTitle').textContent = `メンバー別のタッチ数（${monthLabel(ym)}）`;
    $('memberList').innerHTML = list.map((m, i) => `<div class="member${m.me ? ' me' : ''}">
      <span class="rank">${i + 1}</span>
      <span class="name">${m.name}</span>
      <span class="bar"><div style="width:${m.count / max * 100}%"></div></span>
      <span class="num">${m.count}</span>
    </div>`).join('');
  }

  // 在席登録 = 1タッチ（日時欄の月にカウント）
  $('btnIn').addEventListener('click', () => {
    fillSummary('在席');
    const ym = ($('datetime').value || nowLocal()).slice(0, 7);
    const before = teamCount(ym);
    touches[ym] = myCount(ym) + 1;
    save();
    const after = teamCount(ym);

    $('touchCard').hidden = false;
    $('touchCard').nextElementSibling.hidden = false;
    $('touchMonth').textContent = monthLabel(ym);
    $('teamName').textContent = `${TEAM_NAME}（${TEAM_SIZE}人）`;
    renderMembers(ym, myCount(ym) - 1);
    $('countNum').textContent = before;
    buildTrack(before);
    setProgress(before);
    show('screen-done');

    setTimeout(() => {
      $('countNum').textContent = after;
      $('counter').classList.remove('bump'); void $('counter').offsetWidth; $('counter').classList.add('bump');
      $('plus').classList.remove('go'); void $('plus').offsetWidth; $('plus').classList.add('go');
      setProgress(after);
      renderMembers(ym, myCount(ym));
    }, 500);

    const won = MEDALS.find(m => m.goal === after);
    if (won) setTimeout(() => openAward(won, ym), 1600);
  });
  $('btnOut').addEventListener('click', () => {
    fillSummary('退席');
    $('touchCard').hidden = true;
    $('touchCard').nextElementSibling.hidden = true;
    show('screen-done');
  });

  function openAward(m, ym) {
    $('awardImg').src = medalSrc(m.id);
    $('awardImg').alt = m.name;
    $('awardTitle').textContent = `チーム${m.name}メダル獲得！`;
    $('awardText').textContent = `${monthLabel(ym)}、チームで${m.goal}タッチ達成！ あなたのタッチが決め手になりました`;
    $('award').classList.add('open');
    confetti(m.id === 'gold' ? 260 : m.id === 'silver' ? 180 : 120);
  }
  $('btnAwardClose').addEventListener('click', () => $('award').classList.remove('open'));

  function renderCollection() {
    const cur = thisMonth();
    const months = new Set(Object.keys(touches));
    for (let i = 0; i < 6; i++) months.add(addMonths(cur, -i));
    const list = [...months].filter(ym => ym <= cur).sort().reverse();

    const totals = Object.fromEntries(MEDALS.map(m => [m.id, 0]));
    list.forEach(ym => earned(teamCount(ym)).forEach(m => totals[m.id]++));
    $('totals').innerHTML = MEDALS.map(m => `<div><img src="${medalSrc(m.id)}" alt=""><b>${totals[m.id]}</b><span>${m.name}</span></div>`).join('');

    $('months').innerHTML = list.map(ym => {
      const c = teamCount(ym);
      const medals = MEDALS.map(m => c >= m.goal
        ? `<img src="${medalSrc(m.id)}" alt="${m.name}メダル">`
        : `<img src="assets/medal-empty.svg" alt="${m.name}メダル 未獲得">`).join('');
      return `<div class="month-row${ym === cur ? ' current' : ''}">
        <div class="info"><div class="ym">${monthLabel(ym)}${ym === cur ? '<em>今月</em>' : ''}</div><div class="cnt">チーム <b>${c}</b>タッチ（あなた ${myCount(ym)}）</div></div>
        <div class="medals">${medals}</div>
      </div>`;
    }).join('');
  }

  $('btnDemoAdd').addEventListener('click', () => {
    const ym = thisMonth();
    touches[ym] = (touches[ym] || 0) + 4;
    save();
    renderCollection();
  });
  $('btnReset').addEventListener('click', () => {
    if (!confirm('自分のタッチ数をリセットしますか？（過去月とメンバーのサンプルは残ります）')) return;
    touches = sampleHistory();
    save();
    renderCollection();
  });

  // 紙吹雪
  function confetti(count) {
    const cv = $('confetti'), ctx = cv.getContext('2d');
    cv.width = innerWidth; cv.height = innerHeight;
    const colors = ['#ffd76a', '#f1c40f', '#cd7f32', '#c0c7cf', '#3b6fd1', '#e74c3c'];
    const ps = Array.from({ length: count }, () => ({
      x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      vy: 2 + Math.random() * 3, vx: -1.5 + Math.random() * 3,
      r: Math.random() * Math.PI, vr: -.2 + Math.random() * .4,
      c: colors[Math.floor(Math.random() * colors.length)],
    }));
    const start = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, cv.width, cv.height);
      for (const p of ps) {
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r)));
        ctx.restore();
      }
      if (t - start < 4000) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, cv.width, cv.height);
    })(start);
  }
</script>
</body>
